<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <title>Book PDF editorial directions</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #e8e5df; color: #102c43; font-family: -apple-system, BlinkMacSystemFont, "Noto Sans KR", sans-serif; }
    main { width: 1600px; min-height: 1500px; padding: 54px 60px 64px; margin: 0 auto; background: #f5f2eb; }
    header { display: flex; align-items: end; justify-content: space-between; border-bottom: 2px solid #1e5965; padding-bottom: 22px; margin-bottom: 32px; }
    h1 { margin: 0; font: 600 38px/1.05 Georgia, serif; letter-spacing: .02em; }
    header p { margin: 0; max-width: 620px; text-align: right; color: #53646c; font-size: 16px; line-height: 1.45; }
    .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 26px 22px; }
    figure { margin: 0; background: #fff; border: 1px solid #c8c4ba; box-shadow: 0 5px 16px #18303b18; }
    img { display: block; width: 100%; aspect-ratio: 3 / 2; object-fit: cover; }
    figcaption { min-height: 70px; padding: 12px 14px 14px; border-top: 1px solid #ddd7ca; display: grid; grid-template-columns: 34px 1fr; gap: 10px; align-items: start; }
    .no { color: #8d4a3f; font: 700 12px/1.2 ui-monospace, monospace; }
    strong { display: block; font: 600 17px/1.2 Georgia, serif; }
    small { display: block; margin-top: 5px; color: #68767b; line-height: 1.3; }
    figure.primary { outline: 4px solid #8d4a3f; outline-offset: 3px; }
    figure.spine { outline: 4px solid #2e6872; outline-offset: 3px; }
    .legend { margin-top: 30px; padding-top: 18px; border-top: 1px solid #9fa7a4; display: flex; gap: 28px; color: #52636a; }
    .dot { width: 12px; height: 12px; display: inline-block; margin-right: 7px; background: #8d4a3f; }
    .dot.teal { background: #2e6872; }
  </style>
</head>
<body><main>
  <header><h1>Book PDF editorial directions</h1><p>13 original concept boards. Primary visual modes are 01 Systems Monograph and 07 Evidence Notebook; 13 supplies the content sequence.</p></header>
  <section class="grid">
    <figure class="primary"><img src="mockups/01-systems-monograph.png"><figcaption><span class="no">01</span><span><strong>Systems Monograph</strong><small>Primary narrative design</small></span></figcaption></figure>
    <figure><img src="mockups/02-tradeoff-ledger.png"><figcaption><span class="no">02</span><span><strong>Trade-off Ledger</strong><small>Decision spread</small></span></figcaption></figure>
    <figure><img src="mockups/03-evolutionary-field-guide.png"><figcaption><span class="no">03</span><span><strong>Evolutionary Field Guide</strong><small>Fitness/checkpoint appendix</small></span></figcaption></figure>
    <figure><img src="mockups/04-agent-operations-manual.png"><figcaption><span class="no">04</span><span><strong>Agent Operations Manual</strong><small>Reference-only exploration</small></span></figcaption></figure>
    <figure><img src="mockups/05-illustrated-grokking.png"><figcaption><span class="no">05</span><span><strong>Illustrated Grokking</strong><small>Beginner variant</small></span></figcaption></figure>
    <figure><img src="mockups/06-domain-atlas.png"><figcaption><span class="no">06</span><span><strong>Domain Atlas</strong><small>Ownership map</small></span></figcaption></figure>
    <figure class="primary"><img src="mockups/07-evidence-notebook.png"><figcaption><span class="no">07</span><span><strong>Evidence Notebook</strong><small>Primary evidence design</small></span></figcaption></figure>
    <figure><img src="mockups/08-algorithm-cookbook.png"><figcaption><span class="no">08</span><span><strong>Algorithm Cookbook</strong><small>Procedure spread</small></span></figcaption></figure>
    <figure><img src="mockups/09-recovery-casebook.png"><figcaption><span class="no">09</span><span><strong>Recovery Casebook</strong><small>Failure/recovery support</small></span></figcaption></figure>
    <figure><img src="mockups/10-technical-review.png"><figcaption><span class="no">10</span><span><strong>Technical Review</strong><small>Review summary exploration</small></span></figcaption></figure>
    <figure><img src="mockups/11-reference-handbook.png"><figcaption><span class="no">11</span><span><strong>Reference Handbook</strong><small>Glossary/source appendix</small></span></figcaption></figure>
    <figure><img src="mockups/12-collaborative-workbook.png"><figcaption><span class="no">12</span><span><strong>Collaborative Workbook</strong><small>Learning variant</small></span></figcaption></figure>
    <figure class="spine"><img src="mockups/13-turn-lifecycle-anatomy.png"><figcaption><span class="no">13</span><span><strong>Turn Lifecycle Anatomy</strong><small>Selected content spine</small></span></figcaption></figure>
  </section>
  <div class="legend"><span><i class="dot"></i>Primary visual mode</span><span><i class="dot teal"></i>Content sequence</span><span>Generated assets are direction boards, not final PDF pages.</span></div>
</main></body></html>
